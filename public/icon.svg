<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded rectangle background -->
  <rect width="100" height="100" rx="20" fill="#1f6f43"/>

  <!-- Shopping bag with clean geometric lines -->
  <!-- Left handle -->
  <path d="M32 32 Q32 20 50 18 Q68 20 68 32" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bag body: left edge -->
  <path d="M30 32 L28 72" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Bag body: bottom curve -->
  <path d="M28 72 Q28 78 34 78 L66 78 Q72 78 72 72" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bag body: right edge -->
  <path d="M72 72 L70 32" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Top rim of bag -->
  <line x1="30" y1="32" x2="70" y2="32" stroke="white" stroke-width="5" stroke-linecap="round"/>

  <!-- Center dividing line for bag detail -->
  <line x1="50" y1="35" x2="50" y2="72" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
