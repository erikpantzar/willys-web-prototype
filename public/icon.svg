<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark-mode-aware: browsers that render this SVG as a live document
       (rather than rasterizing it once at install time — support varies by
       OS/browser for home-screen icons) will pick up the darker, less
       saturated gradient automatically via prefers-color-scheme. Best-effort,
       not guaranteed everywhere, but free given this icon is already SVG. -->
  <style>
    .stop1 { stop-color: #2a9660; }
    .stop2 { stop-color: #155c37; }
    @media (prefers-color-scheme: dark) {
      .stop1 { stop-color: #1f7a4f; }
      .stop2 { stop-color: #0c2e1c; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop class="stop1" offset="0%"/>
      <stop class="stop2" offset="100%"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background, soft gradient instead of a flat fill -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Shopping bag, refined proportions + a subtle fill so it reads as
       one shape at small sizes instead of just thin outlines -->
  <path d="M32 32 Q32 19 50 17 Q68 19 68 32" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29 32 L27.5 74 Q27.5 80 34 80 L66 80 Q72.5 80 72.5 74 L71 32 Z"
        fill="white" fill-opacity="0.16" stroke="white" stroke-width="5" stroke-linejoin="round"/>

  <!-- A small checkmark on the bag — ties the icon to "the list", not
       just "shopping" generically -->
  <path d="M41 56 L48 63 L61 48" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
