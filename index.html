<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <title>Willys List</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Willys</h1>
    <span id="who-badge" class="who-badge"></span>
    <button id="settings-btn" aria-label="Settings">⚙</button>
  </header>

  <div id="demo-banner" class="demo-banner" hidden>Demo mode — showing sample data, not your real list</div>
  <main id="app"></main>

  <nav class="tabbar">
    <button data-route="list" class="tab active">
      <span class="tab-icon-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16l-1.5 10.5a2 2 0 01-2 1.5H7.5a2 2 0 01-2-1.5L4 6z" stroke-width="1.8" stroke-linejoin="round"></path><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke-width="1.8"></path></svg>
        <span id="cart-badge" class="cart-badge" hidden></span>
      </span>
      List
    </button>
    <button data-route="delivery" class="tab">
      <span class="tab-icon-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="12" height="9" rx="1.5" stroke-width="1.8"></rect><path d="M14 10h4l3 3v3h-7v-6z" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="7" cy="18" r="1.6"></circle><circle cx="18" cy="18" r="1.6"></circle></svg>
        <span class="tab-badge" hidden></span>
      </span>
      Delivery
    </button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
