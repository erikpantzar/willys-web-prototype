<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <title>Willys List</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Top, not bottom (was a fixed bottom bar — iOS pushes that up above the
       keyboard while typing, which was the whole complaint). Always shows
       all views in one row, so what's to the left/right of the current one
       is just... visible, no separate indicator needed. Swipe left/right
       (see main.js) is the other way to move between them. -->
  <nav class="topnav">
    <button data-route="list" class="tab active">
      List
      <span id="cart-badge" class="cart-badge" hidden></span>
    </button>
    <button data-route="delivery" class="tab">
      Delivery
      <span class="tab-badge" hidden></span>
    </button>
    <button data-route="settings" class="tab">Settings</button>
  </nav>

  <!-- Views are three permanent panes side by side, not swapped in/out —
       #view-track slides horizontally (main.js sets its transform) so
       switching views is an actual slide, not a hard cut, and each pane
       keeps its own scroll position/content instead of being torn down. -->
  <main id="app">
    <div id="demo-banner" class="demo-banner" hidden>Demo mode — showing sample data, not your real list</div>
    <div id="view-track" class="view-track">
      <div class="view-pane" data-pane="list"></div>
      <div class="view-pane" data-pane="delivery"></div>
      <div class="view-pane" data-pane="settings"></div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
